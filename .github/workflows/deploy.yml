name: deploy

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-g2h
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  REGISTRY: 666715258458.dkr.ecr.us-east-1.amazonaws.com
  ROLE_ARN: arn:aws:iam::666715258458:role/g2h-github-actions
  INSTANCE_ID: i-0d8123861d01de683

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push api + worker
        run: |
          set -euo pipefail
          TAG=${GITHUB_SHA::7}
          docker build --platform linux/amd64 --target production -t "$REGISTRY/g2h/api:$TAG" -t "$REGISTRY/g2h/api:latest" apps/api
          docker build --platform linux/amd64 --target production -t "$REGISTRY/g2h/worker:$TAG" -t "$REGISTRY/g2h/worker:latest" apps/worker
          docker push --all-tags "$REGISTRY/g2h/api"
          docker push --all-tags "$REGISTRY/g2h/worker"

      - name: Deploy on server via SSM
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}" \
            --parameters '{"commands":["cd /opt/g2h","aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 666715258458.dkr.ecr.us-east-1.amazonaws.com","docker compose -f compose.prod.yml pull","docker compose -f compose.prod.yml up -d","docker image prune -f"]}' \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}' --output json
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
          echo "Deploy status: $STATUS"
          test "$STATUS" = "Success"
