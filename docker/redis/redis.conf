# Redis configuration shared by local and production stacks.

# Persist to disk so queued jobs and refresh-token entries survive a restart.
appendonly yes
appendfsync everysec

maxmemory 256mb

# MUST stay noeviction. BullMQ stores job state in Redis keys, so an eviction
# policy such as allkeys-lru would silently drop queued jobs under memory
# pressure — reminders and renewals would vanish with no error anywhere.
# Redis will instead reject writes once the limit is hit, which is loud and
# recoverable. Raise maxmemory rather than relaxing this.
maxmemory-policy noeviction
