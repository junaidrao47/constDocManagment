events {}

http {
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;

    # Document uploads are capped at 25 MB by multer in document.router.ts.
    # Allow slightly more here so an oversized file is rejected by the API with a
    # JSON error rather than by nginx with a bare HTML 413. Keep the two in sync:
    # nginx's default is only 1m, which would have failed every real upload.
    client_max_body_size 26m;

    # Upstreams are the Docker Compose service names from compose.prod.yml.
    upstream api      { server api:3001; }
    upstream customer { server customer:3002; }
    upstream admin    { server admin:3000; }

    # Forwarded headers applied to every proxied request.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- HTTP :80 ----------------------------------------------------------------
    # Works immediately on the server's public IP, before a domain or TLS exist: it
    # serves the API and the public site/customer portal. The admin portal lives on
    # its own hostname (admin.<domain>) and becomes reachable once the per-host HTTPS
    # blocks at the bottom are enabled. When a domain is attached, replace this whole
    # server with a redirect:  return 301 https://$host$request_uri;
    server {
        listen 80;
        server_name _;

        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://api;
            # Uploads on a slow connection can exceed the 60s defaults.
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            proxy_request_buffering off;
        }

        # Deliberately not rate limited: this is the container liveness probe.
        # /health is dependency-free; /health/ready reports Postgres and Redis.
        location /health {
            proxy_pass http://api/health;
        }

        # Everything else is the Next.js public site + customer portal.
        location / {
            proxy_pass http://customer;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ===== DEPLOY-TIME: per-host HTTPS ============================================
    # After DNS points the apex, www, admin. and api. records at this box and certbot
    # has issued certificates (the ssl_certs volume is mounted at /etc/letsencrypt),
    # fill in <domain> and uncomment the three server blocks below, then change the
    # :80 server above to `return 301 https://$host$request_uri;`. Certificate paths
    # and the domain are intentionally not committed (AGENT.md: config belongs in the
    # environment), so this stays a template rather than a hardcoded domain.
    #
    # # Public site + customer portal — apex and www.
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name <domain> www.<domain>;
    #     ssl_certificate     /etc/letsencrypt/live/<domain>/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/<domain>/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     location / {
    #         proxy_pass http://customer;
    #         proxy_http_version 1.1;
    #         proxy_set_header Upgrade    $http_upgrade;
    #         proxy_set_header Connection "upgrade";
    #     }
    # }
    #
    # # Admin + staff portal — admin.<domain>.
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name admin.<domain>;
    #     ssl_certificate     /etc/letsencrypt/live/<domain>/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/<domain>/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     location / {
    #         proxy_pass http://admin;
    #         proxy_http_version 1.1;
    #         proxy_set_header Upgrade    $http_upgrade;
    #         proxy_set_header Connection "upgrade";
    #     }
    # }
    #
    # # API — api.<domain>.
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name api.<domain>;
    #     ssl_certificate     /etc/letsencrypt/live/<domain>/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/<domain>/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     location / {
    #         limit_req zone=api burst=20 nodelay;
    #         proxy_pass http://api;
    #         proxy_connect_timeout 10s;
    #         proxy_send_timeout 120s;
    #         proxy_read_timeout 120s;
    #         proxy_request_buffering off;
    #     }
    # }
}
