events {}

http {
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;

    # Document uploads are capped at 25 MB by multer in document.router.ts.
    # Allow slightly more here so an oversized file is rejected by the API with a
    # JSON error rather than by nginx with a bare HTML 413. Keep the two in sync:
    # nginx's default is only 1m, which would have failed every real upload.
    client_max_body_size 26m;

    upstream api {
        server api:3000;
    }

    server {
        listen 80;
        server_name localhost;

        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Uploads on a slow connection can exceed the 60s defaults.
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            proxy_request_buffering off;
        }

        # Deliberately not rate limited: this is the container liveness probe.
        # /health is dependency-free; /health/ready reports Postgres and Redis.
        location /health {
            proxy_pass http://api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            return 200 "ConstDocManagment local nginx is running. API is available at /api/\n";
        }
    }

    # TLS is not enabled yet. compose.prod.yml already publishes 443 and mounts the
    # ssl_certs volume at /etc/letsencrypt, so once certificates are issued for a
    # real domain, uncomment the block below, set server_name, and change the
    # server above to `return 301 https://$host$request_uri;`.
    #
    # Certificate paths and the domain are intentionally not committed here —
    # per AGENT.md they belong in environment configuration, so generate this
    # block at deploy time (certbot writes it) rather than hardcoding a domain.
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name example.com;
    #
    #     ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers off;
    #
    #     add_header Strict-Transport-Security "max-age=31536000" always;
    #
    #     location /api/ { ... same as the :80 block ... }
    #     location /health { ... same as the :80 block ... }
    # }
}
