events {}

http {
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;

    # Document uploads are capped at 25 MB by multer in document.router.ts.
    # Allow slightly more here so an oversized file is rejected by the API with a
    # JSON error rather than by nginx with a bare HTML 413. Keep the two in sync:
    # nginx's default is only 1m, which would have failed every real upload.
    client_max_body_size 26m;

    # Upstreams are the Docker Compose service names from compose.prod.yml.
    upstream api      { server api:3001; }
    upstream customer { server customer:3002; }
    upstream admin    { server admin:3000; }

    # Forwarded headers applied to every proxied request.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- HTTP :80 — ACME challenge, then redirect everything to HTTPS ----
    server {
        listen 80;
        server_name grupog2h.com www.grupog2h.com api.grupog2h.com admin.grupog2h.com;

        # certbot webroot: served over plain HTTP so renewals need no downtime.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- Public site + customer portal — apex and www ----
    server {
        listen 443 ssl;
        http2 on;
        server_name grupog2h.com www.grupog2h.com;
        ssl_certificate     /etc/letsencrypt/live/grupog2h.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/grupog2h.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://api;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            proxy_request_buffering off;
        }

        location /health {
            proxy_pass http://api/health;
        }

        location / {
            proxy_pass http://customer;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ---- Admin + staff portal — admin. ----
    server {
        listen 443 ssl;
        http2 on;
        server_name admin.grupog2h.com;
        ssl_certificate     /etc/letsencrypt/live/grupog2h.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/grupog2h.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://admin;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ---- API — api. ----
    server {
        listen 443 ssl;
        http2 on;
        server_name api.grupog2h.com;
        ssl_certificate     /etc/letsencrypt/live/grupog2h.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/grupog2h.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://api;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            proxy_request_buffering off;
        }
    }
}
